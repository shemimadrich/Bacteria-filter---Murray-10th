<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Murray's Bacteriology Navigator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // Global Database Array - Chapter files automatically plug into this!
    window.BACTERIA_DB = [];
  </script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans">

  <!-- Header -->
  <header class="bg-slate-800 border-b border-slate-700 px-6 py-4 sticky top-0 z-20 flex flex-wrap justify-between items-center gap-4 shadow-lg">
    <div>
      <h1 class="text-xl font-bold text-teal-400">Medical Bacteriology Diagnostic Navigator</h1>
      <p class="text-xs text-slate-400">Modular Multi-Path Differential Engine (Murray's Medical Microbiology)</p>
    </div>
    <div class="flex items-center gap-3">
      <input id="search-input" type="text" placeholder="Search bacteria, toxins, diseases..." 
        class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-sm text-slate-200 focus:outline-none focus:border-teal-500 w-72">
      <button onclick="resetFilters()" class="bg-rose-600/20 hover:bg-rose-600/30 text-rose-300 border border-rose-500/30 px-3 py-1.5 rounded-lg text-sm font-medium transition">
        Reset All
      </button>
    </div>
  </header>

  <div class="max-w-7xl mx-auto p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
    
    <!-- Left Column: 10 Collapsible Master Categories -->
    <aside class="lg:col-span-5 xl:col-span-4 space-y-3">
      <div class="bg-slate-800 border border-slate-700 rounded-xl p-4">
        <div class="flex justify-between items-center mb-3">
          <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-300">Diagnostic Criteria</h2>
          <span id="active-count" class="text-xs bg-teal-500/20 text-teal-300 px-2.5 py-0.5 rounded-full font-medium">0 selected</span>
        </div>
        <p class="text-xs text-slate-400 mb-4">Click any category below to expand options. Incompatible paths automatically grey out.</p>
        <div id="filter-container" class="space-y-2"></div>
      </div>
    </aside>

    <!-- Right Column: Bacteria Pool & Detail View -->
    <main class="lg:col-span-7 xl:col-span-8 space-y-4">
      <!-- Active Filter Pills -->
      <div id="active-pills" class="flex flex-wrap gap-2 empty:hidden bg-slate-800/60 p-3 rounded-xl border border-slate-700"></div>

      <!-- Detailed Profile Panel (Shows at top when clicked) -->
      <div id="detail-panel" class="hidden bg-slate-800 border-2 border-teal-500/70 rounded-xl p-6 space-y-4 shadow-2xl"></div>

      <!-- Results Counter -->
      <div class="flex justify-between items-center pt-1">
        <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400">
          Candidate Pathogens (<span id="match-count" class="text-teal-400">0</span>)
        </h2>
        <span class="text-xs text-slate-400">Click any card to open full profile</span>
      </div>

      <!-- Bacteria Grid -->
      <div id="bacteria-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
    </main>
  </div>

  <script>
    // 10-Category Master Taxonomy
    const filterCategories = [
      {
        id: "cat1",
        label: "1. Staining & Cell Wall Profile",
        options: [
          "Gram-Positive", "Gram-Negative", "Gram-Variable / Poorly Staining",
          "Strongly Acid-Fast", "Weakly / Partially Acid-Fast", "Non-Acid-Fast",
          "Wall-Less / Sterols in Membrane", "Giemsa / Wright-Giemsa", "Silver Stain", "Darkfield Microscopy", "PAS-Positive Macrophages"
        ]
      },
      {
        id: "cat2",
        label: "2. Microscopic Morphology",
        options: [
          "Cocci in Grape-like Clusters", "Cocci in Chains or Pairs", "Lancet-Shaped Diplococci", "Kidney-Bean Diplococci",
          "Regular / Uniform Rods", "Boxcar-Shaped Rods", "Club-Shaped / Chinese-Letter Diphtheroids", "Coccobacilli / Tiny Pleomorphic Rods",
          "Fusiform / Spindle-Shaped Rods", "Branching Filamentous Rods", "Beaded / Cording Rods",
          "Comma-Shaped / Curved Rods", "Gull-Wing / S-Shaped / Helical Rods", "Thin Tightly Coiled Spirochetes",
          "Loosely Coiled Thick Spirochetes", "Hooked-End Spirochetes", "Elementary & Reticulate Bodies", "Intraleukocytic Morulae"
        ]
      },
      {
        id: "cat3",
        label: "3. Oxygen, Intracellularity & Spores",
        options: [
          "Obligate Aerobe", "Facultative Anaerobe", "Aerotolerant Anaerobe", "Microaerophilic", "Capnophilic (Requires CO2)", "Obligate Anaerobe",
          "Extracellular", "Facultative Intracellular", "Obligate Intracellular",
          "Spore-Forming", "Non-Spore-Forming"
        ]
      },
      {
        id: "cat4",
        label: "4. Enzymes, Hemolysis & Motility",
        options: [
          "Catalase (+)", "Catalase (-)", "Coagulase (+)", "Coagulase (-)", "Oxidase (+)", "Oxidase (-)", "Urease (+)",
          "Beta-Hemolytic (Complete)", "Alpha-Hemolytic (Partial/Green)", "Gamma-Hemolytic (Non-Hemolytic)", "Double-Zone Hemolysis",
          "Motile", "Non-Motile", "Tumbling Motility (25°C)", "Swarming Motility", "Corkscrew / Darting Motility", "Actin-Rocket Motility"
        ]
      },
      {
        id: "cat5",
        label: "5. Media, Growth & Colony Hallmarks",
        options: [
          "Rapid Lactose Fermenter", "Slow / Late Lactose Fermenter", "Non-Lactose Fermenter",
          "Chocolate Agar (X & V Factors)", "Chocolate Agar (X Factor Only)", "Chocolate Agar (V Factor Only)",
          "Thayer-Martin Media", "BCYE Agar (Cysteine & Iron)", "Cysteine-Tellurite / Tinsdale Agar", "TCBS Agar",
          "Bordet-Gengou / Regan-Lowe Agar", "Löwenstein-Jensen / Middlebrook Agar", "Mannitol Salt Agar (Yellow)",
          "Bile Esculin Agar (Black)", "Eaton Agar (Fried-Egg Colonies)", "Cell Culture Only", "Unculturable In Vitro",
          "Cold Enrichment (4°C)", "Thermophilic (42°C)", "Halophilic (Salt-Loving)", "Slow-Growing (>7 Days)", "Rapidly Growing Mycobacteria (<7 Days)",
          "Golden-Yellow Colonies", "Blue-Green Pigment + Grape Odor", "Red Pigment (Prodigiosin)", "Salmon-Pink Colonies",
          "Yellow Sulfur Granules", "Photochromogen", "Scotochromogen", "Medusa Head Colonies", "Molar Tooth / Breadcrumb Colonies",
          "Agar Pitting + Bleach Odor", "Butterscotch Odor", "Musty / Mouse Nest Odor", "Horse Stable Odor", "Heavily Mucoid Capsule"
        ]
      },
      {
        id: "cat6",
        label: "6. Differential & Biochemical Tests",
        options: [
          "Bacitracin Susceptible", "Bacitracin Resistant", "Optochin Susceptible + Bile Soluble", "Optochin Resistant",
          "PYR (+)", "CAMP Test / Hippurate (+)", "Growth in 6.5% NaCl", "Novobiocin Susceptible", "Novobiocin Resistant",
          "Nagler Reaction / Lecithinase (+)", "Elek Test (+)", "Indole (+)", "H2S Production (+)", "Citrate (+)", "VP (+)",
          "Phenylalanine Deaminase (+)", "Maltose + Glucose Fermenter", "Glucose Only Fermenter", "Butyrate Esterase (+)",
          "Bipolar Safety-Pin Staining", "Niacin + Nitrate (+)"
        ]
      },
      {
        id: "cat7",
        label: "7. Antigens, Serology & Molecular",
        options: [
          "Lancefield Group A", "Lancefield Group B", "Lancefield Group D",
          "Urinary Antigen Test (+)", "Stool GDH + Toxin A/B Assay", "Sorbitol MacConkey (-)", "Urea Breath / Stool Antigen Test",
          "VDRL / RPR + FTA-ABS / TP-PA", "Cold Agglutinins (Anti-I IgM)", "Two-Tier EIA + Western Blot",
          "Phase I vs Phase II IgG", "ASO / Anti-DNase B Titers"
        ]
      },
      {
        id: "cat8",
        label: "8. Virulence & Toxin Mechanisms",
        options: [
          "Polysaccharide Capsule", "Poly-D-Glutamic Acid Capsule", "M Protein", "Protein A", "IgA1 Protease",
          "Mycolic Acids & Cord Factor", "Biofilm / Slime Layer", "Antigenic Variation", "LOS (Lacks O-Antigen)",
          "Superantigen (TSST-1 / Enterotoxins / Spe)", "AB Toxin: Inhibits EF-2", "AB Toxin: Increases cAMP",
          "Heat-Stable Toxin: Increases cGMP", "28S rRNA Shiga / Shiga-Like Toxin", "Neurotoxin: Blocks ACh (Flaccid)",
          "Neurotoxin: Blocks GABA/Glycine (Spastic)", "Cytoskeleton Toxin (Toxin A/B)", "Cytolytic / Pore-Forming Toxin",
          "Exfoliative Toxins A/B", "Heat-Stable Emetic Toxin", "Heat-Labile Diarrheal Toxin", "CagA & VacA"
        ]
      },
      {
        id: "cat9",
        label: "9. Clinical Syndromes (Organ Systems)",
        options: [
          "Impetigo / Folliculitis / Abscesses", "Erysipelas / Cellulitis", "Necrotizing Fasciitis / Gas Gangrene",
          "Scalded Skin Syndrome (SSSS)", "Cutaneous Eschar / Ulcer", "Erythema Migrans", "Rash on Palms & Soles", "Osteomyelitis / Septic Arthritis",
          "Pharyngitis / Scarlet Fever", "Diphtheria Pseudomembrane", "Epiglottitis / Otitis / Sinusitis", "Typical Lobar Pneumonia",
          "Atypical Walking Pneumonia", "Cavitary / Granulomatous Lung Disease", "Paroxysmal Whooping Cough", "CF / Ventilator Pneumonia",
          "Sepsis / Septic Shock", "Acute Endocarditis", "Subacute / Culture-Negative Endocarditis", "Relapsing / Undulant Fever",
          "Rheumatic Fever / PSGN", "Bacillary Angiomatosis", "Neonatal Meningitis", "Community-Acquired Meningitis",
          "Brain Abscess", "Spastic Paralysis / Tetanus", "Flaccid Paralysis / Botulism", "Neurosyphilis",
          "Rapid-Onset Vomiting", "Watery Secretory Diarrhea", "Inflammatory / Bloody Dysentery", "Pseudomembranous Colitis",
          "Peptic Ulcer / Gastric Cancer", "Enteric (Typhoid) Fever", "Pseudoappendicitis", "Hemolytic Uremic Syndrome (HUS)",
          "UTI / Pyelonephritis / Staghorn Calculi", "Urethritis / Cervicitis / PID", "Painless Chancre", "Painful Chancroid",
          "Lymphogranuloma Venereum", "Bacterial Vaginosis (Clue Cells)", "Neonatal Conjunctivitis", "Trachoma", "Keratitis / Endophthalmitis"
        ]
      },
      {
        id: "cat10",
        label: "10. Epidemiology, Vectors & Quirks",
        options: [
          "Hard Tick (Ixodes / Dermacentor / Amblyomma)", "Soft Tick (Ornithodoros)", "Body Louse (Pediculus)", "Flea (Xenopsylla)", "Chigger / Mite",
          "Cat / Dog Bite or Scratch", "Unpasteurized Dairy / Livestock", "Wool / Animal Hides", "Rabbits / Rodents", "Birds / Parrots",
          "Poultry / Eggs / Reptiles", "Fish / Shellfish / Marine Water", "Armadillos", "Reheated Rice", "Canned Goods / Honey",
          "Undercooked Ground Beef", "Deli Meats / Soft Cheese", "Cooling Towers / Showers / AC", "Hot Tubs / Burn Wounds / Contact Lenses",
          "Dental Procedures / Intravascular Catheters", "Asplenia / Complement Deficiency Risk", "CGD Patient Risk",
          "Iron Overload / Cirrhosis Risk", "Colon Cancer Association", "Intrinsically Cephalosporin-Resistant", "Intrinsically Vancomycin-Resistant"
        ]
      }
    ];

    // List of Chapter Block Files (Mainframe automatically loads any file present here)
    const chapterFiles = [
      "data/ch17_staphylococcus.js",
      "data/ch18_streptococcus.js",
      "data/ch19_bacillus.js",
      "data/ch20_listeria_corynebacterium.js",
      "data/ch21_mycobacterium_nocardia.js",
      "data/ch22_neisseria.js",
      "data/ch23_haemophilus_pasteurella.js",
      "data/ch24_enterobacterales.js",
      "data/ch25_vibrio_aeromonas.js",
      "data/ch26_pseudomonas_nonfermenters.js",
      "data/ch27_campylobacter_helicobacter.js",
      "data/ch28_miscellaneous_gnr.js",
      "data/ch29_clostridium.js",
      "data/ch30_nonspore_anaerobes.js",
      "data/ch31_spirochetes.js",
      "data/ch32_mycoplasma.js",
      "data/ch33_rickettsia_ehrlichia_coxiella.js",
      "data/ch34_chlamydia.js"
    ];

    let activeFilters = new Set();
    let openAccordions = new Set(["cat1"]); // Open Category 1 by default
    let searchQuery = "";
    let selectedBacteriumId = null;

    // Dynamically load chapter files without crashing if some aren't created yet
    function loadAllChapters() {
      let loaded = 0;
      chapterFiles.forEach(src => {
        const script = document.createElement("script");
        script.src = src;
        script.onload = () => { loaded++; render(); };
        script.onerror = () => { loaded++; if (loaded === chapterFiles.length) render(); };
        document.head.appendChild(script);
      });
    }

    function toggleAccordion(catId) {
      if (openAccordions.has(catId)) openAccordions.delete(catId);
      else openAccordions.add(catId);
      render();
    }

    function toggleFilter(tag) {
      if (activeFilters.has(tag)) activeFilters.delete(tag);
      else activeFilters.add(tag);
      render();
    }

    function resetFilters() {
      activeFilters.clear();
      searchQuery = "";
      selectedBacteriumId = null;
      document.getElementById("search-input").value = "";
      render();
    }

    function getMatchingBacteria(testFilters = activeFilters) {
      return window.BACTERIA_DB.filter(b => {
        const matchesTags = [...testFilters].every(tag => b.tags.includes(tag));
        const matchesSearch = !searchQuery || 
          b.name.toLowerCase().includes(searchQuery) ||
          b.triggerWords.some(tw => tw.toLowerCase().includes(searchQuery)) ||
          b.diseases.toLowerCase().includes(searchQuery) ||
          b.tags.some(t => t.toLowerCase().includes(searchQuery));
        return matchesTags && matchesSearch;
      });
    }

    function selectBacterium(id) {
      selectedBacteriumId = id;
      renderDetail();
      document.getElementById("detail-panel").scrollIntoView({ behavior: "smooth", block: "nearest" });
    }

    function render() {
      const matching = getMatchingBacteria();
      document.getElementById("active-count").textContent = `${activeFilters.size} selected`;
      document.getElementById("match-count").textContent = matching.length;

      // Active Filter Pills
      const pillsContainer = document.getElementById("active-pills");
      pillsContainer.innerHTML = [...activeFilters].map(tag => `
        <button onclick="toggleFilter('${tag.replace(/'/g, "\\'")}')" class="bg-teal-500/20 border border-teal-500/40 text-teal-200 text-xs px-3 py-1 rounded-full flex items-center gap-1.5 hover:bg-teal-500/30">
          <span>${tag}</span>
          <span class="font-bold">×</span>
        </button>
      `).join("");

      // Render 10 Collapsible Category Accordions
      const filterContainer = document.getElementById("filter-container");
      filterContainer.innerHTML = filterCategories.map(cat => {
        const isOpen = openAccordions.has(cat.id);
        const activeInCat = cat.options.filter(o => activeFilters.has(o)).length;
        return `
          <div class="border border-slate-700/80 rounded-lg overflow-hidden bg-slate-900/40">
            <button onclick="toggleAccordion('${cat.id}')" class="w-full px-3 py-2.5 text-left flex justify-between items-center hover:bg-slate-800/80 transition">
              <span class="text-xs font-semibold text-slate-200">${cat.label}</span>
              <div class="flex items-center gap-2">
                ${activeInCat > 0 ? `<span class="bg-teal-500 text-slate-950 text-[10px] font-bold px-1.5 py-0.5 rounded-full">${activeInCat}</span>` : ""}
                <span class="text-slate-400 text-xs">${isOpen ? "▲" : "▼"}</span>
              </div>
            </button>
            <div class="${isOpen ? "p-3 border-t border-slate-700/60 flex flex-wrap gap-1.5" : "hidden"}">
              ${cat.options.map(opt => {
                const isSelected = activeFilters.has(opt);
                const hypothetical = new Set(activeFilters);
                hypothetical.add(opt);
                const countIfClicked = getMatchingBacteria(hypothetical).length;
                const isViable = isSelected || countIfClicked > 0;

                let btnClass = "bg-slate-900 border-slate-700 text-slate-300 hover:border-slate-500";
                if (isSelected) btnClass = "bg-teal-600 border-teal-400 text-white font-medium shadow";
                else if (!isViable) btnClass = "bg-slate-900/30 border-slate-800/60 text-slate-600 cursor-not-allowed";

                return `
                  <button ${!isViable ? "disabled" : ""} onclick="toggleFilter('${opt.replace(/'/g, "\\'")}')"
                    class="border text-xs px-2.5 py-1 rounded-lg transition flex items-center gap-1 ${btnClass}">
                    <span>${opt}</span>
                    <span class="text-[10px] opacity-70">(${isSelected ? matching.length : countIfClicked})</span>
                  </button>
                `;
              }).join("")}
            </div>
          </div>
        `;
      }).join("");

      // Render Bacteria Cards
      const grid = document.getElementById("bacteria-grid");
      if (window.BACTERIA_DB.length === 0) {
        grid.innerHTML = `<div class="col-span-2 bg-slate-800 border border-slate-700 rounded-xl p-8 text-center text-slate-400">Waiting for chapter block files in the <b>data/</b> folder...</div>`;
      } else if (matching.length === 0) {
        grid.innerHTML = `<div class="col-span-2 bg-slate-800 border border-slate-700 rounded-xl p-8 text-center text-slate-400">No bacteria match all selected criteria. Click a pill above to remove a filter.</div>`;
      } else {
        grid.innerHTML = matching.map(b => `
          <div onclick="selectBacterium('${b.id}')" 
            class="cursor-pointer bg-slate-800 hover:bg-slate-750 border ${selectedBacteriumId === b.id ? 'border-teal-400 ring-1 ring-teal-400' : 'border-slate-700 hover:border-slate-500'} rounded-xl p-4 transition flex flex-col justify-between">
            <div>
              <div class="text-[11px] text-teal-400 font-medium mb-1">${b.chapter}</div>
              <h3 class="text-lg font-bold italic text-white mb-2">${b.name}</h3>
              <div class="flex flex-wrap gap-1 mb-3">
                ${b.triggerWords.map(tw => `<span class="bg-slate-900 text-amber-300/90 border border-amber-500/20 text-[11px] px-2 py-0.5 rounded">${tw}</span>`).join("")}
              </div>
            </div>
            <div class="text-xs text-slate-400 border-t border-slate-700/60 pt-2 flex justify-between items-center">
              <span>${b.tags.slice(0, 3).join(" • ")}</span>
              <span class="text-teal-400 font-semibold">Open Profile →</span>
            </div>
          </div>
        `).join("");
      }

      if (matching.length === 1) selectedBacteriumId = matching[0].id;
      renderDetail();
    }

    function renderDetail() {
      const panel = document.getElementById("detail-panel");
      const b = window.BACTERIA_DB.find(x => x.id === selectedBacteriumId);
      if (!b) {
        panel.classList.add("hidden");
        return;
      }
      panel.classList.remove("hidden");
      panel.innerHTML = `
        <div class="flex justify-between items-start border-b border-slate-700 pb-3">
          <div>
            <span class="text-xs text-teal-400 font-semibold uppercase">${b.chapter}</span>
            <h2 class="text-2xl font-bold italic text-white">${b.name}</h2>
          </div>
          <button onclick="selectedBacteriumId=null; renderDetail();" class="text-slate-400 hover:text-white text-sm px-2 py-1 border border-slate-700 rounded-lg">Close ✕</button>
        </div>
        <div class="flex flex-wrap gap-1.5">
          ${b.tags.map(t => `<span class="bg-teal-500/10 border border-teal-500/30 text-teal-300 text-xs px-2.5 py-0.5 rounded-full">${t}</span>`).join("")}
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-sm">
          <div class="bg-slate-900/70 p-3.5 rounded-lg border border-slate-700/80">
            <h4 class="text-xs font-bold uppercase text-amber-400 mb-1">Biology & Virulence Mechanisms</h4>
            <p class="text-slate-300 leading-relaxed">${b.virulence}</p>
          </div>
          <div class="bg-slate-900/70 p-3.5 rounded-lg border border-slate-700/80">
            <h4 class="text-xs font-bold uppercase text-rose-400 mb-1">Clinical Diseases</h4>
            <p class="text-slate-300 leading-relaxed">${b.diseases}</p>
          </div>
          <div class="bg-slate-900/70 p-3.5 rounded-lg border border-slate-700/80">
            <h4 class="text-xs font-bold uppercase text-sky-400 mb-1">Laboratory Diagnosis</h4>
            <p class="text-slate-300 leading-relaxed">${b.diagnosis}</p>
          </div>
          <div class="bg-slate-900/70 p-3.5 rounded-lg border border-slate-700/80">
            <h4 class="text-xs font-bold uppercase text-emerald-400 mb-1">Treatment & Control</h4>
            <p class="text-slate-300 leading-relaxed">${b.treatment}</p>
          </div>
        </div>
      `;
    }

    document.getElementById("search-input").addEventListener("input", (e) => {
      searchQuery = e.target.value.toLowerCase();
      render();
    });
    loadAllChapters();
  </script>
</body>
</html>
